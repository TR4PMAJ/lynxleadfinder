name: Refresh Philadelphia Overture business index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 5 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overture downloader
        run: python -m pip install --upgrade overturemaps

      - name: Download Philadelphia-area Places extract
        run: |
          overturemaps download \
            --bbox=-75.35,39.80,-74.85,40.25 \
            --type=place \
            -f geojson \
            -o "$RUNNER_TEMP/overture-philadelphia.geojson"

      - name: Build compact static search index
        run: |
          python scripts/build_overture_snapshot.py \
            --input "$RUNNER_TEMP/overture-philadelphia.geojson" \
            --output public/data/philadelphia-places.json.gz

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/philadelphia-places.json.gz
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit needed."
          else
            git commit -m "Refresh Philadelphia Overture business index"
            git push
          fi
