name: Refresh Pennsylvania and New Jersey Overture index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_overture_snapshot.py"
      - ".github/workflows/refresh-overture.yml"
  schedule:
    - cron: "17 9 5 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overture downloader
        run: python -m pip install --upgrade overturemaps ijson

      - name: Validate index builder syntax
        run: python -m py_compile scripts/build_overture_snapshot.py

      - name: Download Pennsylvania Places
        run: |
          overturemaps download \
            --bbox=-80.52,39.72,-74.69,42.27 \
            --type=place \
            -f geojson \
            -o "$RUNNER_TEMP/pennsylvania.geojson"

      - name: Download New Jersey Places
        run: |
          overturemaps download \
            --bbox=-75.56,38.92,-73.89,41.36 \
            --type=place \
            -f geojson \
            -o "$RUNNER_TEMP/new-jersey.geojson"

      - name: Build state and city searchable tiles
        run: |
          python scripts/build_overture_snapshot.py \
            --input "PA=$RUNNER_TEMP/pennsylvania.geojson" \
            --input "NJ=$RUNNER_TEMP/new-jersey.geojson" \
            --output public/data

      - name: Commit refreshed regional index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/regions.json public/data/regions/
          if git diff --cached --quiet; then
            echo "Index unchanged; no commit needed."
          else
            git commit -m "Refresh Pennsylvania and New Jersey business index"
            git push
          fi
